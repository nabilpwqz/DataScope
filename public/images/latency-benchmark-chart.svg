<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="tealBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="indigoBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="980" height="440" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="40" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Live Query Execution Latencies Across 110,000+ Records</text>
  <text x="40" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Measured on PostgreSQL 15 serverless engine with Drizzle ORM pushdown vs. unindexed baseline</text>

  <!-- Axis & Grid lines -->
  <g stroke="#334155" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6">
    <line x1="320" y1="90" x2="320" y2="390"/>
    <line x1="440" y1="90" x2="440" y2="390"/>
    <line x1="560" y1="90" x2="560" y2="390"/>
    <line x1="680" y1="90" x2="680" y2="390"/>
    <line x1="800" y1="90" x2="800" y2="390"/>
    <line x1="920" y1="90" x2="920" y2="390"/>
  </g>

  <!-- Scale labels (ms) -->
  <text x="320" y="408" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">0 ms</text>
  <text x="440" y="408" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">10 ms</text>
  <text x="560" y="408" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">20 ms</text>
  <text x="680" y="408" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">30 ms</text>
  <text x="800" y="408" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">40 ms</text>
  <text x="920" y="408" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">50 ms</text>

  <!-- Bar 1: Server LRU Cache Hit -->
  <g transform="translate(40, 100)">
    <text x="0" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">In-Memory LRU Cache Hit</text>
    <text x="0" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">MD5 Query Hash Match (Warm)</text>
    <rect x="280" y="10" width="12" height="24" rx="4" fill="url(#emeraldBar)"/>
    <text x="302" y="27" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">0.1 ms</text>
    <rect x="850" y="12" width="60" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="880" y="26" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">PASSED</text>
  </g>

  <!-- Bar 2: PostgreSQL FTS -->
  <g transform="translate(40, 150)">
    <text x="0" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">PostgreSQL Full-Text Search</text>
    <text x="0" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">GIN Index on tsvector (Cold)</text>
    <rect x="280" y="10" width="149" height="24" rx="4" fill="url(#tealBar)"/>
    <text x="439" y="27" fill="#2dd4bf" font-family="monospace" font-size="12" font-weight="bold">12.4 ms</text>
    <rect x="850" y="12" width="60" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="880" y="26" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">PASSED</text>
  </g>

  <!-- Bar 3: PostgreSQL Trigram -->
  <g transform="translate(40, 200)">
    <text x="0" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Trigram Typo-Tolerant Search</text>
    <text x="0" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">GIN (title gin_trgm_ops) (Cold)</text>
    <rect x="280" y="10" width="224" height="24" rx="4" fill="url(#cyanBar)"/>
    <text x="514" y="27" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">18.7 ms</text>
    <rect x="850" y="12" width="60" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="880" y="26" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">PASSED</text>
  </g>

  <!-- Bar 4: Keyset Pagination -->
  <g transform="translate(40, 250)">
    <text x="0" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Deep Keyset / Offset Pagination</text>
    <text x="0" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Deterministic Seek: Page 100 (Cold)</text>
    <rect x="280" y="10" width="323" height="24" rx="4" fill="url(#blueBar)"/>
    <text x="613" y="27" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">26.9 ms</text>
    <rect x="850" y="12" width="60" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="880" y="26" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">PASSED</text>
  </g>

  <!-- Bar 5: Multi-Condition Pushdown -->
  <g transform="translate(40, 300)">
    <text x="0" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Multi-Condition Pushdown Filter</text>
    <text x="0" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Status + Country + Revenue &gt; $10k</text>
    <rect x="280" y="10" width="439" height="24" rx="4" fill="url(#indigoBar)"/>
    <text x="729" y="27" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="bold">36.6 ms</text>
    <rect x="850" y="12" width="60" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <text x="880" y="26" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">PASSED</text>
  </g>

  <!-- Bottom Comparison Callout -->
  <g transform="translate(40, 350)">
    <rect width="900" height="34" rx="6" fill="#450a0a" fill-opacity="0.4" stroke="#991b1b" stroke-width="1"/>
    <text x="16" y="22" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">UNINDEXED SCAN COMPARISON:</text>
    <text x="215" y="22" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Sequential scan without DataScope composite indexes took <tspan font-family="monospace" font-weight="bold" fill="#ef4444">1,240.4 ms</tspan> (Over 300x slower).</text>
  </g>
</svg>

