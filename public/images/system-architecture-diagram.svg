  <path d="M 330 320 L 300 320" stroke="#34d399" stroke-width="2"/>
  <polygon points="302,316 294,320 302,324" fill="#34d399"/>
  <text x="315" y="340" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">0.1ms</text>
</svg>

