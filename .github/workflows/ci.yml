name: DataScope CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test, Benchmark & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Seed Initial 100,000 Records
        run: npm run seed

      - name: Run Vitest Automated Test Suite
        run: npm test

      - name: Run Search & Latency Performance Benchmarks
        run: npm run benchmark

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
