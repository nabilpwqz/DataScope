name: DataScope CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NEXTAUTH_SECRET: ci-test-secret-key-32-chars-minimum-datascope
      NEXTAUTH_URL: http://localhost:3000
      JWT_SECRET: ci-test-secret-key-32-chars-minimum-datascope
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/datascope
      SEARCH_STRATEGY: hybrid
      NEXT_TELEMETRY_DISABLED: 1

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: datascope
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Hallmark Sloplint Verification
        run: node scripts/run-sloplint.js

      - name: Database Migrations & Seeds
        run: |
          npx tsx scripts/seed.ts --scale=100k --force

      - name: Vitest Unit & Integration Tests
        run: npm test

      - name: Production Next.js Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

